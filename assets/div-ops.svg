.label{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;fill:#8b9dca}
</style><clipPath id="bar"><rect width="830" height="44" rx="12"/></clipPath></defs>
<g clip-path="url(#bar)"><rect width="830" height="44" fill="#08112b"/>
<rect width="830" height="44" fill="url(#aurora)" opacity=".07"/>
