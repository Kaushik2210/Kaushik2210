<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Open to internships, freelance and project-based roles. How I work: scope, build, ship a live demo, hand off."><title>Open to internships, freelance and project-based roles. How I work: scope, build, ship a live demo, hand off.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes dash{to{stroke-dashoffset:-28}}@keyframes in{from{opacity:0}to{opacity:1}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}.slot{animation:dash 1.6s linear infinite}.plus{animation:blink 2s ease-in-out infinite}.c{animation:in .5s ease-out both}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="900" height="250" rx="12" fill="#0b0221"/><rect class="slot" x="28" y="34" width="92" height="92" rx="10" fill="none" stroke="#ff2a6d" stroke-width="2.5" stroke-dasharray="8 6"/><text x="74.0" y="96.0" font-size="44" font-weight="300" fill="#ff2a6d" text-anchor="middle" class="plus">+</text><text x="144" y="64" font-size="22" font-weight="700" fill="#f5f0ff">This square is empty. It's for your project.</text><text x="144" y="90" font-size="14" fill="#a99fd6">Open to internships, freelance and project-based roles: security tooling,</text><text x="144" y="110" font-size="14" fill="#a99fd6">AI-agent infrastructure and full-stack products. Bangalore or remote.</text><rect x="28.0" y="156" width="18" height="18" rx="2" fill="#4c1d95" class="c" style="animation-delay:0.30s"/><text class="m" x="56.0" y="170" font-size="12" fill="#6f63a3">01</text><text x="82.0" y="171" font-size="16" font-weight="700" fill="#f5f0ff">Scope</text><text x="28.0" y="200" font-size="13" fill="#a99fd6">one-page spec,</text><text x="28.0" y="218" font-size="13" fill="#a99fd6">clear milestones</text><path d="M205.0 165h18" stroke="#2e1d66" stroke-width="2"/><rect x="239.0" y="156" width="18" height="18" rx="2" fill="#a21caf" class="c" style="animation-delay:0.55s"/><text class="m" x="267.0" y="170" font-size="12" fill="#6f63a3">02</text><text x="293.0" y="171" font-size="16" font-weight="700" fill="#f5f0ff">Build</text><text x="239.0" y="200" font-size="13" fill="#a99fd6">small commits,</text><text x="239.0" y="218" font-size="13" fill="#a99fd6">tests as I go</text><path d="M416.0 165h18" stroke="#2e1d66" stroke-width="2"/><rect x="450.0" y="156" width="18" height="18" rx="2" fill="#ff2a6d" class="c" style="animation-delay:0.80s"/><text class="m" x="478.0" y="170" font-size="12" fill="#6f63a3">03</text><text x="504.0" y="171" font-size="16" font-weight="700" fill="#f5f0ff">Ship</text><text x="450.0" y="200" font-size="13" fill="#a99fd6">a live demo</text><text x="450.0" y="218" font-size="13" fill="#a99fd6">you can click</text><path d="M627.0 165h18" stroke="#2e1d66" stroke-width="2"/><rect x="661.0" y="156" width="18" height="18" rx="2" fill="#05d9e8" class="c" style="animation-delay:1.05s"/><text class="m" x="689.0" y="170" font-size="12" fill="#6f63a3">04</text><text x="715.0" y="171" font-size="16" font-weight="700" fill="#f5f0ff">Hand off</text><text x="661.0" y="200" font-size="13" fill="#a99fd6">README, docs,</text><text x="661.0" y="218" font-size="13" fill="#a99fd6">a walkthrough</text></svg>