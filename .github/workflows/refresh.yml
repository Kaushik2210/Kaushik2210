name: Redraw the squares

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**"]

concurrency:
  group: redraw
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "heatmap-bot"
          git config user.email "heatmap-bot@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "redraw squares"
          git push
