name: Bugsweeper move

on:
  issues:
    types: [opened]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, '[SWEEP]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Play the move
        run: python scripts/sweep.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Commit
        run: |
          git config user.name "bugsweeper-bot"
          git config user.email "bugsweeper-bot@users.noreply.github.com"
          git add README.md game/
          git diff --cached --quiet && exit 0
          git commit -m "bugsweeper move"
          git pull --rebase -q
          git push
