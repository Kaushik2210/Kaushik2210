name: Rebuild profile (hero, builds, charts)

on:
  schedule:
    - cron: "17 * * * *" # hourly: GitHub drops some scheduled runs, so ask often to keep the header sky current
  workflow_dispatch: {}
  push:
    paths: ["scripts/**", "data/**", "ctf/desc.hex"]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest main, not the stale trigger-time sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Render header, dossier, launch log, badge and the visitor terminal
        working-directory: scripts
        run: |
          python banners.py "${{ github.repository_owner }}" ../assets
          python dossier.py "${{ github.repository_owner }}" ../assets/dossier.svg
          python hero.py    "${{ github.repository_owner }}" ../assets/header.svg
          python badge.py   "${{ github.repository_owner }}" ../assets/badge.svg
          python proof.py   "${{ github.repository_owner }}" ../assets/proof.svg
          python launch.py  "${{ github.repository_owner }}" ../assets/launch.svg
          python posters.py  "${{ github.repository_owner }}" ../README.md
          python shell.py --render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "showcase-bot"
          git config user.email "showcase-bot@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(showcase): rescan"
          git pull --rebase -X theirs -q
          git push
