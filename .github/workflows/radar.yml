name: Update Threat Radar

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  push:
    paths: ["scripts/radar.py", "ctf/desc.hex"]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render radar
        run: python scripts/radar.py "${{ github.repository_owner }}" assets/radar.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add assets/radar.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(radar): rescan"
          git pull --rebase -q
          git push
