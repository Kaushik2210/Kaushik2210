name: Light a square

on:
  issues:
    types: [opened]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  light:
    if: startsWith(github.event.issue.title, '[SQUARE]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and record the square
        run: python scripts/square_add.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Redraw the wall
        run: python scripts/build.py --wall
      - name: Commit
        run: |
          git config user.name "square-bot"
          git config user.email "square-bot@users.noreply.github.com"
          git add squares/ assets/wall-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "light a square"
          git pull --rebase -q
          git push
