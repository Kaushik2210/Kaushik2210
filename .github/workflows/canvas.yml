name: Night Canvas

on:
  issues:
    types: [opened]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  paint:
    if: startsWith(github.event.issue.title, '[PAINT]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest main, not the stale trigger-time sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paint the pixel and redraw the canvas
        run: python scripts/canvas.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Redraw the header so the rooftop billboard shows this painter
        working-directory: scripts
        run: python hero.py "${{ github.repository_owner }}" ../assets/header.svg || echo "header redraw skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "canvas-bot"
          git config user.email "canvas-bot@users.noreply.github.com"
          git add README.md canvas/ assets/canvas/ assets/canvas-timelapse.svg assets/header.svg
          git diff --cached --quiet && exit 0
          git commit -m "night canvas: new pixel"
          git pull --rebase -q
          git push
