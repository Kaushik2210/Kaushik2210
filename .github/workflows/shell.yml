name: kaushik.sh

on:
  issues:
    types: [opened]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  answer:
    if: startsWith(github.event.issue.title, '[SH]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest main, not the stale trigger-time sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer the command and redraw the terminal
        run: python scripts/shell.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Redraw the header so the rooftop billboard shows this command
        working-directory: scripts
        run: python hero.py "${{ github.repository_owner }}" ../assets/header.svg || echo "header redraw skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "shell-bot"
          git config user.email "shell-bot@users.noreply.github.com"
          git add README.md shell/ assets/shell.svg assets/header.svg
          git diff --cached --quiet && exit 0
          git commit -m "kaushik.sh: new command"
          git pull --rebase -q
          git push
