name: Count a vote

on:
  issues:
    types: [opened]

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, '[VOTE]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}  # latest main, not the stale trigger-time sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record the vote and redraw the cards
        run: python scripts/poll.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Commit
        run: |
          git config user.name "vote-bot"
          git config user.email "vote-bot@users.noreply.github.com"
          git add README.md poll/ assets/vote-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "count a vote"
          git pull --rebase -q
          git push
